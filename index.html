<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric & Photo ASCII Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ascii-container {
      white-space: pre;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 11px;
      line-height: 10px;
      letter-spacing: 1px;
      text-align: center;
      color: #e0e0e0;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
      user-select: none;
    }
    .start-btn {
      position: absolute;
      bottom: 40px;
      padding: 12px 24px;
      font-size: 16px;
      font-family: sans-serif;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
      z-index: 10;
    }
    .start-btn:hover {
      background: #cccccc;
    }
  </style>
</head>
<body>

  <div id="ascii-container">Memuat foto...</div>
  <button class="start-btn" id="startBtn" onclick="startShow()">Play Show</button>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('ascii-container');

    let photoImage = new Image();
    photoImage.src = 'pacar.jpg'; 

    photoImage.onload = () => {
      renderImageToASCII(photoImage);
    };

    photoImage.onerror = () => {
      container.innerText = 'Foto "pacar.jpg" tidak ditemukan di folder!';
    };

    // Timeline pergerakan lirik (waktu dalam detik)
    const timeline = [
      { type: "image", time: 0 },
      { type: "text", text: "About You", time: 5 },
      { type: "text", text: "The 1975", time: 8 },
      { type: "text", text: "I Know A Place", time: 12 },
      { type: "text", text: "It's Somewhere\nI Go", time: 17 },
      { type: "text", text: "When I Need To\nRemember", time: 22 },
      { type: "text", text: "Your Face", time: 27 },
      { type: "text", text: "We Get Married", time: 31 },
      { type: "text", text: "In Our Heads", time: 35 },
      { type: "text", text: "Something to do\nwhile we try to recall\nhow we met", time: 39 }
    ];

    const chars = [" ", ".", ":", "*", "I", "M", "W", "#", "%", "@"];

    function renderTextToASCII(text) {
      const lines = text.split('\n');
      const fontSize = 40;
      ctx.font = `bold ${fontSize}px sans-serif`;
      
      let maxWidth = 0;
      lines.forEach(line => {
        const w = ctx.measureText(line).width;
        if (w > maxWidth) maxWidth = w;
      });

      canvas.width = Math.max(maxWidth + 20, 160);
      canvas.height = lines.length * (fontSize + 10) + 20;

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      lines.forEach((line, index) => {
        const y = (index + 1) * (fontSize) + 5;
        ctx.fillText(line, canvas.width / 2, y);
      });

      processCanvasToASCII(4);
    }

    function renderImageToASCII(img) {
      const targetWidth = 100;
      const scale = targetWidth / img.width;
      canvas.width = targetWidth;
      canvas.height = img.height * scale;

      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      processCanvasToASCII(1);
    }

    function processCanvasToASCII(sampleStep) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      let asciiStr = "";

      for (let y = 0; y < canvas.height; y += sampleStep) {
        for (let x = 0; x < canvas.width; x += sampleStep) {
          const index = (y * canvas.width + x) * 4;
          const r = data[index];
          const g = data[index + 1];
          const b = data[index + 2];
          const brightness = (r + g + b) / 3;

          const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
          asciiStr += chars[charIndex];
        }
        asciiStr += "\n";
      }

      container.innerText = asciiStr;
    }

    function startShow() {
      document.getElementById('startBtn').style.display = 'none';
      let startTime = Date.now();

      function update() {
        let currentTime = (Date.now() - startTime) / 1000;
        
        let currentItem = timeline[0];
        for (let i = 0; i < timeline.length; i++) {
          if (currentTime >= timeline[i].time) {
            currentItem = timeline[i];
          }
        }

        if (currentItem.type === "image") {
          renderImageToASCII(photoImage);
        } else if (currentItem.type === "text") {
          renderTextToASCII(currentItem.text);
        }

        requestAnimationFrame(update);
      }

      update();
    }
  </script>
</body>
</html>
